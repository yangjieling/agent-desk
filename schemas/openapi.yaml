openapi: 3.1.0
info:
  title: agent-desk Local API
  version: 0.2.0
  license:
    name: Apache-2.0
  description: |
    Local-first HTTP API for the agent-desk harness (`oh web`).

    **Scope (MVP):** documents the existing Fastify surface on localhost.
    There is no cloud multi-tenant auth — the process OS user is the trust
    boundary (see `docs/security.md`).

    **Not Multica Public API:** no PAT/OAuth, no Idempotency-Key ledger, no
    plugin scopes. Those can be layered later if needed.

    Interactive docs: `GET /api/docs` (Swagger UI). Raw spec: `GET /openapi.yaml`.

    Related JSON Schemas in this directory: `task.schema.json`, `agent.schema.json`,
    `work-item.schema.json`, `workflow.schema.json`, `autopilot.schema.json`, etc.
servers:
  - url: http://127.0.0.1:19877
    description: Default `oh web` listen address (override with AD_HOST / AD_PORT)
tags:
  - name: Health
  - name: Dashboard
  - name: Inbox
  - name: Agents
  - name: Projects
  - name: Tasks
  - name: WorkItems
  - name: Workflows
  - name: WorkflowRuns
  - name: Autopilots
  - name: Skills
  - name: Issues
  - name: Settings
  - name: Runtimes
  - name: Filesystem
  - name: System
  - name: Meta

paths:
  /openapi.yaml:
    get:
      tags: [Meta]
      operationId: getOpenApiYaml
      summary: OpenAPI document (YAML)
      responses:
        "200":
          description: OpenAPI 3.1 YAML
          content:
            application/yaml:
              schema:
                type: string
  /api/openapi.yaml:
    get:
      tags: [Meta]
      operationId: getOpenApiYamlAlias
      summary: OpenAPI document (alias under /api)
      responses:
        "200":
          description: OpenAPI 3.1 YAML
          content:
            application/yaml:
              schema:
                type: string
  /api/docs:
    get:
      tags: [Meta]
      operationId: getApiDocs
      summary: Swagger UI for this API
      responses:
        "200":
          description: HTML page
          content:
            text/html:
              schema:
                type: string

  /api/health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Liveness, installed agent runtimes, and local executor
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/executor:
    get:
      tags: [Runtimes]
      operationId: getLocalExecutor
      summary: In-process local executor status (claim + heartbeat)
      responses:
        "200":
          description: Executor status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocalExecutorStatus"

  /api/dashboard:
    get:
      tags: [Dashboard]
      operationId: getDashboard
      summary: Overview counts and recent items
      responses:
        "200":
          description: Dashboard payload
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /api/inbox:
    get:
      tags: [Inbox]
      operationId: getInbox
      summary: Aggregate gate awaits and work items awaiting acceptance
      responses:
        "200":
          description: Inbox list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboxResponse"

  /api/fs/browse:
    get:
      tags: [Filesystem]
      operationId: browseFilesystem
      summary: Browse local directories for the project-dir picker
      parameters:
        - name: path
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Directory listing
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /api/fs/mkdir:
    post:
      tags: [Filesystem]
      operationId: mkdirFilesystem
      summary: Create a directory under an allowed browse root
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                path:
                  type: string
                name:
                  type: string
      responses:
        "200":
          description: Created path info
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /api/settings:
    get:
      tags: [Settings]
      operationId: getSettings
      summary: Read persisted settings (secrets masked by default)
      parameters:
        - name: revealSecrets
          in: query
          schema:
            type: string
            enum: ["1", "true"]
      responses:
        "200":
          description: Settings object
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
    put:
      tags: [Settings]
      operationId: putSettings
      summary: Update settings (blank/masked secrets keep previous values)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Settings"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"

  /api/issue-providers:
    get:
      tags: [Issues]
      operationId: listIssueProviders
      summary: Registered issue backends
      responses:
        "200":
          description: Provider list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProviderInfo"

  /api/notify-providers:
    get:
      tags: [Settings]
      operationId: listNotifyProviders
      summary: Registered notify backends
      responses:
        "200":
          description: Provider list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProviderInfo"

  /api/runtimes:
    get:
      tags: [Runtimes]
      operationId: listRuntimes
      summary: Probe agent CLIs on PATH
      parameters:
        - $ref: "#/components/parameters/FreshQuery"
      responses:
        "200":
          description: Runtime statuses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgentRuntime"

  /api/agent-providers:
    get:
      tags: [Runtimes]
      operationId: listInstalledAgentProviders
      summary: Agent backends that are installed/available
      parameters:
        - $ref: "#/components/parameters/FreshQuery"
      responses:
        "200":
          description: Installed providers
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true

  /api/agent-models:
    get:
      tags: [Agents]
      operationId: listAgentModels
      summary: Models advertised by an agent backend
      parameters:
        - name: agent
          in: query
          description: Provider id (e.g. claude, codex, cursor)
          schema:
            type: string
      responses:
        "200":
          description: Model list
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
        "400":
          $ref: "#/components/responses/Error"

  /api/agents:
    get:
      tags: [Agents]
      operationId: listAgents
      summary: List named agent profiles
      responses:
        "200":
          description: Agents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgentProfile"
    post:
      tags: [Agents]
      operationId: createAgent
      summary: Create an agent profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentProfileWrite"
      responses:
        "200":
          description: Created agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentProfile"
        "400":
          $ref: "#/components/responses/Error"

  /api/agents/{id}:
    parameters:
      - $ref: "#/components/parameters/AgentId"
    get:
      tags: [Agents]
      operationId: getAgent
      summary: Get one agent profile
      responses:
        "200":
          description: Agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentProfile"
        "404":
          $ref: "#/components/responses/Error"
    put:
      tags: [Agents]
      operationId: updateAgent
      summary: Update an agent profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentProfileWrite"
      responses:
        "200":
          description: Updated agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentProfile"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      tags: [Agents]
      operationId: deleteAgent
      summary: Delete an agent profile
      responses:
        "200":
          $ref: "#/components/responses/Ok"
        "404":
          $ref: "#/components/responses/Error"

  /api/projects:
    get:
      tags: [Projects]
      operationId: listProjects
      summary: List named local workspace projects
      responses:
        "200":
          description: Projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
    post:
      tags: [Projects]
      operationId: createProject
      summary: Create a project bookmark
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectWrite"
      responses:
        "200":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/Error"

  /api/projects/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: "^p_"
    get:
      tags: [Projects]
      operationId: getProject
      summary: Get one project
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          $ref: "#/components/responses/Error"
    put:
      tags: [Projects]
      operationId: updateProject
      summary: Update a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectWrite"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      tags: [Projects]
      operationId: deleteProject
      summary: Delete a project bookmark
      responses:
        "200":
          $ref: "#/components/responses/Ok"
        "404":
          $ref: "#/components/responses/Error"

  /api/skills:
    get:
      tags: [Skills]
      operationId: listSkills
      summary: List skill summaries
      parameters:
        - name: cwd
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Skills
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true

  /api/skills/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Skills]
      operationId: getSkill
      summary: Resolve a skill pack
      parameters:
        - name: cwd
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Skill detail
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "404":
          $ref: "#/components/responses/Error"
    delete:
      tags: [Skills]
      operationId: deleteSkill
      summary: Uninstall a user skill
      responses:
        "200":
          description: Uninstall result
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /api/skills/sync:
    post:
      tags: [Skills]
      operationId: syncSkills
      summary: Sync bundled skills and seed user skills
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                force:
                  type: boolean
      responses:
        "200":
          description: Sync + seed result
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /api/issues:
    get:
      tags: [Issues]
      operationId: listIssues
      summary: List issues from the configured issue provider
      parameters:
        - name: state
          in: query
          schema:
            type: string
        - name: label
          in: query
          schema:
            oneOf:
              - type: string
              - type: array
                items:
                  type: string
        - name: limit
          in: query
          schema:
            type: string
        - name: provider
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Issues
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Issue"
        "400":
          $ref: "#/components/responses/Error"

  /api/issues/{code}:
    get:
      tags: [Issues]
      operationId: getIssue
      summary: Get one issue by code
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
        - name: provider
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Issue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Issue"
        "404":
          $ref: "#/components/responses/Error"

  /api/issues/{code}/work-item:
    get:
      tags: [WorkItems]
      operationId: resolveIssueWorkItem
      summary: Resolve or create the local work item for an issue
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
        - name: provider
          in: query
          schema:
            type: string
        - name: title
          in: query
          schema:
            type: string
        - name: projectDir
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Work item detail bundle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkItemDetail"
        "400":
          $ref: "#/components/responses/Error"

  /api/github/resolve-workspace:
    post:
      tags: [Issues]
      operationId: resolveGitHubWorkspace
      summary: Ensure local clone / workspace for GitHub issue provider
      responses:
        "200":
          description: Workspace info
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          $ref: "#/components/responses/Error"

  /api/work-items:
    get:
      tags: [WorkItems]
      operationId: listWorkItems
      summary: List local work items (newest first, capped)
      responses:
        "200":
          description: Work items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkItem"

  /api/work-items/{id}:
    parameters:
      - $ref: "#/components/parameters/WorkItemId"
    get:
      tags: [WorkItems]
      operationId: getWorkItem
      summary: Work item with tasks, events, and optional issue snapshot
      responses:
        "200":
          description: Detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkItemDetail"
        "404":
          $ref: "#/components/responses/Error"

  /api/work-items/{id}/tasks:
    parameters:
      - $ref: "#/components/parameters/WorkItemId"
    get:
      tags: [WorkItems]
      operationId: listWorkItemTasks
      summary: Tasks linked to a work item
      responses:
        "200":
          description: Tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
        "404":
          $ref: "#/components/responses/Error"

  /api/work-items/{id}/events:
    parameters:
      - $ref: "#/components/parameters/WorkItemId"
    get:
      tags: [WorkItems]
      operationId: listWorkItemEvents
      summary: Event / comment timeline
      responses:
        "200":
          description: Events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkItemEvent"
        "404":
          $ref: "#/components/responses/Error"
    post:
      tags: [WorkItems]
      operationId: createWorkItemNote
      summary: Add a manual note; @Agent mentions wake agents without changing assignee
      description: |
        Parses `@AgentName`, `@a_…` ids, and Multica-style `[@Name](mention://agent/<id>)` links.
        Each mentioned agent gets a skill task (coalesced if that agent already has an active task
        on this work item). Pass `wake: false` to post a note without waking anyone.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body:
                  type: string
                  maxLength: 4000
                wake:
                  type: boolean
                  default: true
                  description: When false, skip @mention dispatch
      responses:
        "200":
          description: Created event plus mention dispatch result
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/WorkItemEvent"
                  - type: object
                    properties:
                      mentions:
                        type: array
                        items:
                          type: object
                          properties:
                            agentProfileId:
                              type: string
                            label:
                              type: string
                      startedTaskIds:
                        type: array
                        items:
                          type: string
                      coalescedTaskIds:
                        type: array
                        items:
                          type: string
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /api/work-items/{id}/assign:
    parameters:
      - $ref: "#/components/parameters/WorkItemId"
    post:
      tags: [WorkItems]
      operationId: assignWorkItem
      summary: Assign (or unassign) a work item to an Agent profile
      description: |
        Sets `workItem.agentProfileId`. Changing assignee to a new agent starts a run by default
        (`start` omitted or true). Same assignee only starts when `start: true` (UI「启动」).
        Cancelled work items update assignee but do not start. Does not cancel in-flight tasks.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                agentProfileId:
                  type: string
                  description: Agent id (`a_…`); empty string unassigns
                start:
                  type: boolean
                  description: Default true when assignee changes; force true to re-run same assignee
                note:
                  type: string
                  maxLength: 2000
                  description: Optional handoff note written to the timeline
      responses:
        "200":
          description: Assign result
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  workItem:
                    $ref: "#/components/schemas/WorkItem"
                  started:
                    type: boolean
                  coalesced:
                    type: boolean
                  skippedReason:
                    type: string
                    description: unassigned | start_suppressed | cancelled | unchanged | already_active
                  task:
                    nullable: true
                    allOf:
                      - $ref: "#/components/schemas/Task"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /api/work-items/{id}/accept:
    parameters:
      - $ref: "#/components/parameters/WorkItemId"
    post:
      tags: [WorkItems]
      operationId: acceptWorkItem
      summary: Accept a work item in in_review
      responses:
        "200":
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  workItem:
                    $ref: "#/components/schemas/WorkItem"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /api/work-items/{id}/reject:
    parameters:
      - $ref: "#/components/parameters/WorkItemId"
    post:
      tags: [WorkItems]
      operationId: rejectWorkItem
      summary: Reject acceptance and reopen
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                note:
                  type: string
                  maxLength: 2000
      responses:
        "200":
          description: Rejected / reopened
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  workItem:
                    $ref: "#/components/schemas/WorkItem"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /api/tasks:
    get:
      tags: [Tasks]
      operationId: listTasks
      summary: List tasks
      responses:
        "200":
          description: Tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
    post:
      tags: [Tasks]
      operationId: createTask
      summary: Create a skill task and enqueue start
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTaskRequest"
      responses:
        "200":
          description: Created task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          $ref: "#/components/responses/Error"

  /api/tasks/{id}:
    parameters:
      - $ref: "#/components/parameters/TaskId"
    get:
      tags: [Tasks]
      operationId: getTask
      summary: Get a task (may include usage when parseable from Claude logs)
      responses:
        "200":
          description: Task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      tags: [Tasks]
      operationId: deleteTask
      summary: Stop and delete a task
      responses:
        "200":
          $ref: "#/components/responses/Ok"
        "404":
          $ref: "#/components/responses/Error"

  /api/tasks/{id}/log:
    parameters:
      - $ref: "#/components/parameters/TaskId"
    get:
      tags: [Tasks]
      operationId: getTaskLog
      summary: Incremental log chunk
      parameters:
        - name: offset
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Log slice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskLogChunk"
        "404":
          $ref: "#/components/responses/Error"

  /api/tasks/{id}/stream:
    parameters:
      - $ref: "#/components/parameters/TaskId"
    get:
      tags: [Tasks]
      operationId: streamTask
      summary: Server-Sent Events for live task updates
      parameters:
        - name: offset
          in: query
          description: Byte offset into result log for append catch-up
          schema:
            type: string
      responses:
        "200":
          description: text/event-stream
          content:
            text/event-stream:
              schema:
                type: string
        "404":
          $ref: "#/components/responses/Error"

  /api/tasks/{id}/start:
    parameters:
      - $ref: "#/components/parameters/TaskId"
    post:
      tags: [Tasks]
      operationId: startTask
      summary: Start or restart a startable task
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /api/tasks/{id}/resume:
    parameters:
      - $ref: "#/components/parameters/TaskId"
    post:
      tags: [Tasks]
      operationId: resumeTask
      summary: Resume after a gate (or continue a stopped task)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reply:
                  type: string
                  description: Gate choice text / continue message
                model:
                  type: string
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
    get:
      tags: [Tasks]
      operationId: resumeTaskDeepLink
      summary: HTML deep-link resume (notify / browser)
      parameters:
        - name: reply
          in: query
          schema:
            type: string
      responses:
        "200":
