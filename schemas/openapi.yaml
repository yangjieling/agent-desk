          description: Updated run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowRun"
        "400":
          $ref: "#/components/responses/Error"

  /api/workflow-runs/{id}/stop:
    parameters:
      - $ref: "#/components/parameters/WorkflowRunId"
    post:
      tags: [WorkflowRuns]
      operationId: stopWorkflowRun
      summary: Stop a workflow run
      responses:
        "200":
          description: Updated run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowRun"
        "404":
          $ref: "#/components/responses/Error"

  /api/autopilots:
    get:
      tags: [Autopilots]
      operationId: listAutopilots
      summary: List autopilot rules (includes lastRun summary)
      responses:
        "200":
          description: Autopilots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AutopilotSummary"
    post:
      tags: [Autopilots]
      operationId: createAutopilot
      summary: Create an autopilot rule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutopilotWrite"
      responses:
        "200":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutopilotSummary"
        "400":
          $ref: "#/components/responses/Error"

  /api/autopilots/cron/preview:
    post:
      tags: [Autopilots]
      operationId: previewAutopilotCron
      summary: Preview next cron fire times
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                expression:
                  type: string
                count:
                  type: integer
                  minimum: 1
                  maximum: 12
      responses:
        "200":
          description: Preview
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  expression:
                    type: string
                  next:
                    type: array
                    items:
                      type: integer
        "400":
          $ref: "#/components/responses/Error"

  /api/autopilots/{id}:
    parameters:
      - $ref: "#/components/parameters/AutopilotId"
    get:
      tags: [Autopilots]
      operationId: getAutopilot
      summary: Get one autopilot
      responses:
        "200":
          description: Autopilot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutopilotSummary"
        "404":
          $ref: "#/components/responses/Error"
    put:
      tags: [Autopilots]
      operationId: updateAutopilot
      summary: Update an autopilot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutopilotWrite"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutopilotSummary"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      tags: [Autopilots]
      operationId: deleteAutopilot
      summary: Archive/delete an autopilot
      responses:
        "200":
          $ref: "#/components/responses/Ok"
        "404":
          $ref: "#/components/responses/Error"

  /api/autopilots/{id}/pause:
    parameters:
      - $ref: "#/components/parameters/AutopilotId"
    post:
      tags: [Autopilots]
      operationId: pauseAutopilot
      summary: Pause scheduling
      responses:
        "200":
          description: Paused
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutopilotSummary"
        "404":
          $ref: "#/components/responses/Error"

  /api/autopilots/{id}/resume:
    parameters:
      - $ref: "#/components/parameters/AutopilotId"
    post:
      tags: [Autopilots]
      operationId: resumeAutopilot
      summary: Resume scheduling
      responses:
        "200":
          description: Active again
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutopilotSummary"
        "404":
          $ref: "#/components/responses/Error"

  /api/autopilots/{id}/run:
    parameters:
      - $ref: "#/components/parameters/AutopilotId"
    post:
      tags: [Autopilots]
      operationId: runAutopilotNow
      summary: Fire immediately (manual source)
      responses:
        "200":
          description: Dispatch result
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  run:
                    $ref: "#/components/schemas/AutopilotRun"
                  autopilot:
                    $ref: "#/components/schemas/AutopilotSummary"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /api/autopilots/{id}/webhook/rotate:
    parameters:
      - $ref: "#/components/parameters/AutopilotId"
    post:
      tags: [Autopilots]
      operationId: rotateAutopilotWebhook
      summary: Rotate webhook path token and optionally HMAC secret
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                rotateSecret:
                  type: boolean
                  default: true
      responses:
        "200":
          description: Autopilot with revealed secrets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutopilotSummary"
        "404":
          $ref: "#/components/responses/Error"

  /api/webhooks/autopilots/{token}:
    parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [Autopilots]
      operationId: triggerAutopilotWebhook
      summary: Inbound webhook trigger (token in path; optional X-Hub-Signature-256)
      description: |
        Enqueues an Autopilot run (source=webhook). Use Idempotency-Key or X-GitHub-Delivery for dedupe.
        JSON body is appended to the runbook as a payload block.
      parameters:
        - name: X-Hub-Signature-256
          in: header
          required: false
          schema:
            type: string
          description: sha256=<hex> HMAC of raw body when webhookSecret is set
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
        - name: X-GitHub-Delivery
          in: header
          required: false
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Accepted, duplicate, or skipped
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [accepted, duplicate, skipped]
                  deliveryId:
                    type: string
                  runId:
                    type: string
                  taskId:
                    type: string
                  workflowRunId:
                    type: string
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"

  /api/autopilots/{id}/runs:
    parameters:
      - $ref: "#/components/parameters/AutopilotId"
    get:
      tags: [Autopilots]
      operationId: listAutopilotRuns
      summary: Recent runs for an autopilot
      responses:
        "200":
          description: Runs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AutopilotRun"
        "404":
          $ref: "#/components/responses/Error"

  /api/shutdown:
    post:
      tags: [System]
      operationId: shutdownServer
      summary: Gracefully stop the local server process
      responses:
        "200":
          $ref: "#/components/responses/Ok"

components:
  parameters:
    FreshQuery:
      name: fresh
      in: query
      description: Force re-probe (`1` or `true`)
      schema:
        type: string
    AgentId:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: "^a_"
    TaskId:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: "^t_"
    WorkItemId:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: "^wi_"
    WorkflowId:
      name: id
      in: path
      required: true
      schema:
        type: string
    WorkflowRunId:
      name: id
      in: path
      required: true
      schema:
        type: string
    AutopilotId:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: "^ap_"

  responses:
    Ok:
      description: Success
      content:
        application/json:
          schema:
            type: object
            required: [ok]
            properties:
              ok:
                type: boolean
                const: true
    Error:
      description: Error envelope
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"

  schemas:
    ErrorBody:
      type: object
      required: [error]
      properties:
        error:
          type: string
        hint:
          type: string
        status:
          type: string
        task:
          $ref: "#/components/schemas/Task"

    HealthResponse:
      type: object
      properties:
        ok:
          type: boolean
        version:
          type: string
        runtimes:
          type: object
          properties:
            installed:
              type: integer
            total:
              type: integer
            providers:
              type: array
              items:
                type: string
        executor:
          $ref: "#/components/schemas/LocalExecutorStatus"

    ProviderInfo:
      type: object
      properties:
        id:
          type: string
        displayName:
          type: string

    AgentRuntime:
      type: object
      properties:
        id:
          type: string
        displayName:
          type: string
        installed:
          type: boolean
        version:
          type: string
        path:
          type: string
        error:
          type: string

    AgentProfile:
      type: object
      required: [id, name, provider, createdAt, updatedAt]
      properties:
        id:
          type: string
          pattern: "^a_"
        name:
          type: string
          maxLength: 80
        provider:
          type: string
        model:
          type: string
        defaultSkill:
          type: string
          description: Primary skill id for new tasks / assign / @mention
        skills:
          type: array
          items:
            type: string
          description: Extra skill ids always mounted with this agent at run time
        instructions:
          type: string
        createdAt:
          type: integer
        updatedAt:
          type: integer

    AgentProfileWrite:
      type: object
      properties:
        name:
          type: string
        provider:
          type: string
        model:
          type: string
        defaultSkill:
          type: string
        skills:
          type: array
          items:
            type: string
        instructions:
          type: string

    Project:
      type: object
      required: [id, name, projectDir, createdAt, updatedAt]
      properties:
        id:
          type: string
          pattern: "^p_"
        name:
          type: string
          maxLength: 80
        projectDir:
          type: string
          description: Absolute local workspace directory
        repoUrl:
          type: string
          description: Optional repo URL (documentation; no auto-clone in MVP)
        createdAt:
          type: integer
        updatedAt:
          type: integer

    ProjectWrite:
      type: object
      properties:
        name:
          type: string
        projectDir:
          type: string
        repoUrl:
          type: string

    Task:
      type: object
      required: [id, status, taskType, createdAt, updatedAt]
      properties:
        id:
          type: string
          pattern: "^t_"
        taskType:
          type: string
          enum: [skill, workflow]
        status:
          type: string
          enum: [created, queued, dispatched, running, awaiting, done, failed, stopped]
        skill:
          type: string
        workflowId:
          type: string
        workflowRunId:
          type: string
        workflowName:
          type: string
        workflowMode:
          type: string
          enum: [shared, independent]
        workflowStep:
          type: integer
        workflowStepTotal:
          type: integer
        parentTaskId:
          type: string
        workflowNodeIndex:
          type: [integer, "null"]
        projectDir:
          type: string
        workItemId:
          type: string
        issueCode:
          type: string
        title:
          type: string
        prompt:
          type: string
        agentProfileId:
          type: string
        codingAgent:
          type: string
        model:
          type: string
        sessionId:
          type: string
        result:
          type: string
        gateNotifyHash:
          type: string
        retryCount:
          type: integer
        failureCode:
          type: string
        failureMessage:
          type: string
        nextRetryAt:
          type: integer
        claimToken:
          type: string
        claimedBy:
          type: string
        claimedAt:
          type: integer
        heartbeatAt:
          type: integer
        createdAt:
          type: integer
        updatedAt:
          type: integer
        lastActivityAt:
          type: integer
        usage:
          type: object
          description: Optional Claude usage parsed from result JSONL
          additionalProperties: true

    LocalExecutorStatus:
      type: object
      properties:
        id:
          type: string
        mode:
          type: string
          enum: [in_process]
        online:
          type: boolean
        hostname:
          type: string
        pid:
          type: integer
        startedAt:
          type: integer
        lastHeartbeatAt:
          type: integer
        lastPollAt:
          type: integer
        maxConcurrent:
          type: integer
        slotCount:
          type: integer
        claimedTaskIds:
          type: array
          items:
            type: string
        hint:
          type: string

    CreateTaskRequest:
      type: object
      required: [prompt]
      properties:
        title:
          type: string
        prompt:
          type: string
        projectDir:
          type: string
        issueCode:
          type: string
        workItemId:
          type: string
        skill:
          type: string
        agentProfileId:
          type: string
        codingAgent:
          type: string
        model:
          type: string

    TaskLogChunk:
      type: object
      properties:
        offset:
          type: integer
        length:
          type: integer
        chunk:
          type: string
        status:
          type: string

    WorkItem:
      type: object
      required: [id, title, status, createdAt, updatedAt]
      properties:
        id:
          type: string
          pattern: "^wi_"
        title:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [open, in_progress, in_review, done, cancelled]
        projectDir:
          type: string
        issueProvider:
          type: string
        issueCode:
          type: string
        agentProfileId:
          type: string
          description: Assigned Agent profile id (`a_…`); empty = unassigned
        createdAt:
          type: integer
        updatedAt:
          type: integer
        lastActivityAt:
          type: integer

    WorkItemEvent:
      type: object
      required: [id, workItemId, kind, body, createdAt]
      properties:
        id:
          type: string
          pattern: "^we_"
        workItemId:
          type: string
        kind:
          type: string
          enum: [note, gate_reply, run_linked, system]
        author:
          type: string
        body:
          type: string
        taskId:
          type: string
        createdAt:
          type: integer

    WorkItemDetail:
      type: object
      properties:
        workItem:
          $ref: "#/components/schemas/WorkItem"
        tasks:
          type: array
          items:
            $ref: "#/components/schemas/Task"
        events:
          type: array
          items:
            $ref: "#/components/schemas/WorkItemEvent"
        issue:
          oneOf:
            - $ref: "#/components/schemas/Issue"
            - type: "null"

    Issue:
      type: object
      properties:
        code:
          type: string
        title:
          type: string
        status:
          type: string
        severity:
          type: string
        description:
          type: string
        projectDir:
          type: string
        url:
          type: string
        labels:
          type: array
          items:
            type: string
        updatedAt:
          type: integer

    InboxResponse:
      type: object
      properties:
        ok:
          type: boolean
        count:
          type: integer
        items:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
                enum: [gate, acceptance]
              taskId:
                type: string
              workItemId:
                type: string
              title:
                type: string
              status:
                type: string
              gateHeading:
                type: [string, "null"]
              gateName:
                type: [string, "null"]
              choices:
                type: array
                items:
                  type: object
                  additionalProperties: true
              skill:
                type: string
              workflowName:
                type: string
              issueCode:
                type: string
              projectDir:
                type: string
              agentProfileId:
                type: string
              updatedAt:
                type: integer
              lastActivityAt:
                type: integer

    WorkflowNode:
      type: object
      required: [id, skill, title]
      properties:
        id:
          type: string
        skill:
          type: string
        title:
          type: string
        prompt:
          type: string
        agentProfileId:
          type: string
        requireGate:
          type: boolean
        onFailure:
          type: string
          enum: [stop, continue, retry]

    Workflow:
      type: object
      required: [id, name, mode, nodes]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        mode:
          type: string
          enum: [shared, independent]
        source:
          type: string
          enum: [system, user]
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowNode"
        createdAt:
          type: integer
        updatedAt:
          type: integer

    WorkflowWrite:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        mode:
          type: string
          enum: [shared, independent]
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowNode"

    WorkflowRun:
      type: object
      description: Workflow execution record (see workflow engine store)
      additionalProperties: true
      properties:
        id:
          type: string
        workflowId:
          type: string
        status:
          type: string
        title:
          type: string
        createdAt:
          type: integer
        updatedAt:
          type: integer

    Autopilot:
      type: object
      required: [id, name, status, action, cronExpression, createdAt, updatedAt]
      properties:
        id:
          type: string
          pattern: "^ap_"
        name:
          type: string
        runbook:
          type: string
        status:
          type: string
          enum: [active, paused, archived]
        action:
          type: string
          enum: [skill_task, workflow_run]
        executionMode:
          type: string
          enum: [run_only, create_work_item]
        skill:
          type: string
        workflowId:
          type: string
        projectDir:
          type: string
        agentProfileId:
          type: string
        model:
          type: string
        titleTemplate:
          type: string
        cronExpression:
          type: string
        timezone:
          type: string
        nextRunAt:
          type: integer
        lastRunAt:
          type: integer
        concurrencyPolicy:
          type: string
          enum: [skip, allow]
        webhookEnabled:
          type: boolean
        webhookToken:
          type: string
        webhookSecret:
          type: string
          description: Masked as ******** unless revealSecrets=1
        createdAt:
          type: integer
        updatedAt:
          type: integer

    AutopilotSummary:
      allOf:
        - $ref: "#/components/schemas/Autopilot"
        - type: object
          properties:
            webhookUrl:
              type: string
            lastRun:
              oneOf:
                - $ref: "#/components/schemas/AutopilotRun"
                - type: "null"

    AutopilotWrite:
      type: object
      properties:
        name:
          type: string
        runbook:
          type: string
        status:
          type: string
          enum: [active, paused, archived]
        action:
          type: string
          enum: [skill_task, workflow_run]
        executionMode:
          type: string
          enum: [run_only, create_work_item]
        skill:
          type: string
        workflowId:
          type: string
        projectDir:
          type: string
        agentProfileId:
          type: string
        model:
          type: string
        titleTemplate:
          type: string
        cronExpression:
          type: string
        timezone:
          type: string
        concurrencyPolicy:
          type: string
          enum: [skip, allow]
        webhookEnabled:
          type: boolean

    AutopilotRun:
      type: object
      required: [id, autopilotId, source, status, createdAt]
      properties:
        id:
          type: string
          pattern: "^ar_"
        autopilotId:
          type: string
        source:
          type: string
          enum: [schedule, manual, webhook]
        status:
          type: string
          enum: [pending, running, skipped, completed, failed]
        taskId:
          type: string
        workflowRunId:
          type: string
        workItemId:
          type: string
        plannedAt:
          type: integer
        triggeredAt:
          type: integer
        completedAt:
          type: integer
        failureReason:
          type: string
        createdAt:
          type: integer

    Settings:
      type: object
      description: >
        Persisted settings under ~/.agent-desk. Full field list lives in
        settings.schema.json; secrets are masked in GET unless revealSecrets.
      additionalProperties: true
