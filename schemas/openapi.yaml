                  type: string
      responses:
        "200":
          description: Workflow run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowRun"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /api/workflow-runs:
    get:
      tags: [WorkflowRuns]
      operationId: listWorkflowRuns
      summary: List workflow runs
      responses:
        "200":
          description: Runs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkflowRun"

  /api/workflow-runs/{id}:
    parameters:
      - $ref: "#/components/parameters/WorkflowRunId"
    get:
      tags: [WorkflowRuns]
      operationId: getWorkflowRun
      summary: Get a workflow run
      responses:
        "200":
          description: Run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowRun"
        "404":
          $ref: "#/components/responses/Error"

  /api/workflow-runs/{id}/continue:
    parameters:
      - $ref: "#/components/parameters/WorkflowRunId"
    post:
      tags: [WorkflowRuns]
